<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delivery Note</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    input, button, canvas { margin: 5px 0; width: 100%; }
    #serials li { margin-bottom: 5px; }
    #signature-pad { border: 1px solid #ccc; touch-action: none; }
    #qr-reader { margin-top: 10px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <h2>Delivery Note</h2>
  <div id="note">
    <p><strong>Note #:</strong> <span id="noteNumber"></span></p>
    <p><strong>Date:</strong> <span id="noteDate"></span></p>
    <label>To: <input type="text" id="toField" /></label>
    <label>From: <input type="text" id="fromField" /></label>
    <p><strong>Model Unit:</strong> Lenovo Chromebook</p>
    <hr/>
    <label>Serial Number: <input type="text" id="serialInput" /></label>
    <button onclick="addSerial()">Add Serial</button>
    <button onclick="startScanner()">Scan QR/Barcode</button>
    <ul id="serials"></ul>
    <div id="qr-reader" style="width: 100%;"></div>
    <hr/>
    <p><strong>Signature of Receiver:</strong></p>
    <canvas id="signature-pad" width="500" height="150"></canvas>
    <button onclick="clearSignature()">Clear Signature</button>
    <hr/>
    <button onclick="exportPDF()">Export as PDF</button>
  </div>

  <script>
    document.getElementById('noteNumber').textContent = 'DN-' + Date.now();
    document.getElementById('noteDate').textContent = new Date().toISOString().split('T')[0];

    function addSerial(value = null) {
      const input = document.getElementById('serialInput');
      const sn = value || input.value.trim();
      if (sn) {
        const li = document.createElement('li');
        li.textContent = sn;
        document.getElementById('serials').appendChild(li);
        input.value = '';
      }
    }

    // Signature pad
    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    canvas.addEventListener('touchstart', () => drawing = true);
    canvas.addEventListener('touchend', () => {
      drawing = false;
      ctx.beginPath();
    });
    canvas.addEventListener('touchmove', drawTouch);

    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => {
      drawing = false;
      ctx.beginPath();
    });
    canvas.addEventListener('mousemove', drawMouse);

    function drawMouse(e) {
      if (!drawing) return;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    }

    function drawTouch(e) {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const x = touch.clientX - rect.left;
      const y = touch.clientY - rect.top;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function clearSignature() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // QR Scanner with rear camera preference
    function startScanner() {
      const qrDiv = document.getElementById('qr-reader');
      qrDiv.innerHTML = ''; // Clear previous scanner
      const qrScanner = new Html5Qrcode("qr-reader");

      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
          const backCam = devices.find(d => d.label.toLowerCase().includes('back')) || devices[0];
          qrScanner.start(
            backCam.id,
            { fps: 10, qrbox: 250 },
            (decodedText) => {
              addSerial(decodedText);
              qrScanner.stop().then(() => qrDiv.innerHTML = '');
            },
            (errorMessage) => {
              console.warn("QR scan error:", errorMessage);
            }
          );
        } else {
          alert("No camera found.");
        }
      }).catch(err => {
        console.error("Camera access error:", err);
        alert("Unable to access camera. Make sure permissions are granted.");
      });
    }

    function exportPDF() {
      html2pdf().set({ margin: 10, filename: 'delivery_note.pdf' }).from(document.getElementById('note')).save();
    }
  </script>
</body>
</html>
