<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#080b0d">

<title>DJIS 2x2 ID Photo Booth</title>

<!-- MediaPipe Selfie Segmentation -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<style>

/* =========================================================
   DJIS THEME
========================================================= */

:root{
  --bg:#080b0d;
  --surface:#11171b;
  --surface2:#20292e;
  --border:#283137;
  --primary:#35d7ff;
  --primary-dark:#001014;
  --text:#ffffff;
  --muted:#9da8ad;
  --muted2:#78858b;
  --danger:#ff7474;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100dvh;
}

button,
input,
select{
  font-family:inherit;
}

button{
  -webkit-appearance:none;
}


/* =========================================================
   SCREEN
========================================================= */

.screen{
  display:none;
  width:100%;
  height:100dvh;
}

.screen.active{
  display:flex;
}


/* =========================================================
   ID SCREEN
========================================================= */

#idScreen{
  align-items:center;
  justify-content:center;
  padding:25px;
}

.idBox{
  width:min(420px,100%);
  text-align:center;
}

.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:8px;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:35px;
}

.idInput{
  width:100%;
  height:58px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
  color:var(--text);
  text-align:center;
  font-size:22px;
  outline:none;
  padding:0 15px;
}

.idInput::placeholder{
  color:#68757b;
}

.idInput:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(53,215,255,.12);
}

.startBtn{
  width:100%;
  height:58px;
  margin-top:18px;
  border:0;
  border-radius:14px;
  background:var(--primary);
  color:var(--primary-dark);
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.startBtn:active{
  transform:scale(.98);
}

.info{
  margin-top:18px;
  font-size:12px;
  color:var(--muted2);
  line-height:1.5;
}


/* =========================================================
   CAMERA SCREEN
========================================================= */

#cameraScreen{
  position:relative;
  background:#000;
  align-items:center;
  justify-content:center;
}

#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}


/* =========================================================
   CAMERA TOP
========================================================= */

.cameraTop{
  position:absolute;
  z-index:10;
  top:0;
  left:0;
  right:0;

  padding:
    max(15px,env(safe-area-inset-top))
    15px
    15px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.78),
      rgba(0,0,0,0)
    );
}

.cameraTitle{
  font-size:15px;
  font-weight:700;
}

.cameraStatus{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
}

.switchBtn{
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.55);
  color:var(--text);
  height:42px;
  padding:0 15px;
  border-radius:22px;
  font-weight:700;
  cursor:pointer;
  backdrop-filter:blur(8px);
}

.switchBtn:active{
  transform:scale(.96);
}


/* =========================================================
   2 x 2 PHOTO GUIDE
========================================================= */

.photoGuide{
  position:absolute;
  z-index:5;

  width:min(78vw,380px);
  aspect-ratio:1 / 1;

  border:3px solid rgba(255,255,255,.95);
  border-radius:4px;

  pointer-events:none;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,.30),
    0 0 25px rgba(0,0,0,.5);
}

.guideLabel{
  position:absolute;
  z-index:6;

  top:calc(50% + min(39vw,190px) + 12px);

  transform:translateY(-50%);

  font-size:12px;
  color:rgba(255,255,255,.85);

  background:rgba(0,0,0,.55);

  padding:6px 10px;

  border-radius:12px;

  white-space:nowrap;
}


/* =========================================================
   CAMERA BOTTOM
========================================================= */

.cameraBottom{
  position:absolute;
  z-index:10;

  left:0;
  right:0;
  bottom:0;

  padding:
    15px
    15px
    max(20px,env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.84),
      rgba(0,0,0,0)
    );
}

.cameraSelect{
  width:min(450px,95%);
  height:40px;

  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;

  background:rgba(0,0,0,.65);
  color:var(--text);

  padding:0 12px;
  outline:none;

  display:none;
}

.captureBtn{
  width:76px;
  height:76px;

  border-radius:50%;

  border:6px solid rgba(255,255,255,.85);

  background:#fff;

  cursor:pointer;

  box-shadow:
    0 3px 20px rgba(0,0,0,.5);
}

.captureBtn:active{
  transform:scale(.92);
}

.captureBtn:disabled{
  opacity:.35;
}


/* =========================================================
   ERROR PANEL
========================================================= */

.errorPanel{
  position:absolute;
  z-index:40;

  left:20px;
  right:20px;
  top:50%;

  transform:translateY(-50%);

  background:var(--surface);
  border:1px solid var(--border);

  border-radius:18px;

  padding:25px;

  text-align:center;

  display:none;
}

.errorPanel.show{
  display:block;
}

.errorTitle{
  color:var(--danger);
  font-size:18px;
  font-weight:800;
  margin-bottom:10px;
}

.errorText{
  color:#b7c1c5;
  font-size:13px;
  line-height:1.5;
  white-space:pre-line;
}

.retryBtn{
  margin-top:18px;

  height:46px;
  padding:0 20px;

  border:0;
  border-radius:12px;

  background:var(--primary);
  color:var(--primary-dark);

  font-weight:800;
}


/* =========================================================
   PREVIEW SCREEN
========================================================= */

#previewScreen{
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:
    20px
    20px
    max(20px,env(safe-area-inset-bottom));

  overflow:auto;
}

.previewTitle{
  font-size:20px;
  font-weight:800;
  margin-bottom:15px;
  letter-spacing:.5px;
}

.previewStudent{
  color:var(--muted);
  font-size:12px;
  margin-top:-7px;
  margin-bottom:14px;
}


/* =========================================================
   2 x 2 PHOTO CARD
========================================================= */

.previewCard{
  width:min(350px,78vw);
  aspect-ratio:1 / 1;

  background:#fff;

  border-radius:5px;
  overflow:hidden;

  box-shadow:
    0 10px 40px rgba(0,0,0,.55);

  position:relative;
}

#previewImage{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* =========================================================
   STATUS
========================================================= */

.previewStatus{
  margin-top:10px;

  color:var(--muted);
  font-size:12px;

  text-align:center;

  min-height:16px;
}


/* =========================================================
   BACKGROUND CONTROLS
========================================================= */

.backgroundControls{
  width:min(420px,100%);

  margin-top:15px;

  display:none;

  flex-direction:column;

  gap:10px;
}

.backgroundControls.show{
  display:flex;
}

.removeBgBtn{
  width:100%;
  height:52px;

  border:0;
  border-radius:13px;

  background:var(--primary);
  color:var(--primary-dark);

  font-size:15px;
  font-weight:800;

  cursor:pointer;
}

.removeBgBtn:active{
  transform:scale(.98);
}

.bgOptions{
  display:none;

  grid-template-columns:1fr 1fr;

  gap:10px;
}

.bgOptions.show{
  display:grid;
}

.bgBtn{
  height:46px;

  border:1px solid var(--border);
  border-radius:12px;

  background:var(--surface);
  color:var(--text);

  font-size:13px;
  font-weight:700;

  cursor:pointer;
}

.bgBtn.active{
  border-color:var(--primary);

  background:
    rgba(53,215,255,.10);

  color:var(--primary);
}

.bgBtn:active{
  transform:scale(.98);
}


/* =========================================================
   PREVIEW BUTTONS
========================================================= */

.previewButtons{
  width:min(420px,100%);

  display:flex;
  gap:12px;

  margin-top:15px;
}

.downloadBtn,
.retakeBtn{
  flex:1;

  height:54px;

  border:0;
  border-radius:13px;

  font-size:15px;
  font-weight:800;

  cursor:pointer;
}

.downloadBtn{
  background:var(--primary);
  color:var(--primary-dark);
}

.retakeBtn{
  background:var(--surface2);
  color:var(--text);
}

.downloadBtn:active,
.retakeBtn:active{
  transform:scale(.98);
}


/* =========================================================
   LOADING
========================================================= */

.loading{
  position:absolute;
  z-index:50;
  inset:0;

  background:rgba(0,0,0,.72);

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  backdrop-filter:blur(3px);
}

.loading.show{
  display:flex;
}

.spinner{
  width:45px;
  height:45px;

  border:4px solid rgba(255,255,255,.2);

  border-top-color:var(--primary);

  border-radius:50%;

  animation:spin .8s linear infinite;
}

.loadingText{
  margin-top:14px;

  font-size:13px;

  color:#d0d8db;

  text-align:center;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media(max-height:520px){

  .photoGuide{
    height:68vh;
    width:68vh;
  }

  .guideLabel{
    display:none;
  }

  .cameraBottom{
    padding-top:5px;
  }

  .captureBtn{
    width:62px;
    height:62px;
  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:360px){

  .photoGuide{
    width:76vw;
  }

  .captureBtn{
    width:68px;
    height:68px;
  }

  .previewCard{
    width:min(300px,75vw);
  }

}

</style>

</head>

<body>


<!-- =========================================================
     SCREEN 1
========================================================= -->

<section id="idScreen" class="screen active">

  <div class="idBox">

    <div class="logo">
      DJIS
    </div>

    <div class="subtitle">
      2 × 2 ID PHOTO BOOTH
    </div>

    <input
      id="studentId"
      class="idInput"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Enter Student ID"
      maxlength="30">

    <button
      id="startBtn"
      class="startBtn"
      type="button">

      START CAPTURE

    </button>

    <div class="info">

      Capture a square 2 × 2 passport-style photo.<br>

      Downloaded at 600 × 600 pixels for high-quality printing.

    </div>

  </div>

</section>


<!-- =========================================================
     SCREEN 2
========================================================= -->

<section id="cameraScreen" class="screen">

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <div class="cameraTop">

    <div>

      <div class="cameraTitle">
        2 × 2 ID PHOTO
      </div>

      <div
        id="cameraStatus"
        class="cameraStatus">

        Starting camera...

      </div>

    </div>


    <button
      id="switchBtn"
      class="switchBtn"
      type="button">

      ↻ Switch

    </button>

  </div>


  <div class="photoGuide"></div>


  <div class="guideLabel">
    2 × 2 INCH • SQUARE
  </div>


  <div class="cameraBottom">

    <select
      id="cameraSelect"
      class="cameraSelect">
    </select>


    <button
      id="captureBtn"
      class="captureBtn"
      type="button"
      aria-label="Take 2 by 2 photo">
    </button>

  </div>


  <div
    id="errorPanel"
    class="errorPanel">

    <div class="errorTitle">
      CAMERA ERROR
    </div>

    <div
      id="errorText"
      class="errorText">
    </div>

    <button
      id="retryBtn"
      class="retryBtn"
      type="button">

      TRY AGAIN

    </button>

  </div>


  <div
    id="loading"
    class="loading">

    <div class="spinner"></div>

    <div
      id="loadingText"
      class="loadingText">

      Starting camera...

    </div>

  </div>

</section>


<!-- =========================================================
     SCREEN 3
========================================================= -->

<section
  id="previewScreen"
  class="screen">

  <div class="previewTitle">
    2 × 2 PHOTO PREVIEW
  </div>

  <div
    id="previewStudent"
    class="previewStudent">
  </div>


  <div class="previewCard">

    <img
      id="previewImage"
      alt="Captured 2 by 2 ID photo">

  </div>


  <div
    id="previewStatus"
    class="previewStatus">

    Original photo • 600 × 600 px

  </div>


  <div
    id="backgroundControls"
    class="backgroundControls">

    <button
      id="removeBgBtn"
      class="removeBgBtn"
      type="button">

      ✨ REMOVE BACKGROUND

    </button>


    <div
      id="bgOptions"
      class="bgOptions">

      <button
        id="transparentBtn"
        class="bgBtn"
        type="button">

        TRANSPARENT

      </button>

      <button
        id="whiteBtn"
        class="bgBtn"
        type="button">

        WHITE BACKGROUND

      </button>

    </div>

  </div>


  <div class="previewButtons">

    <button
      id="retakeBtn"
      class="retakeBtn"
      type="button">

      RETAKE

    </button>

    <button
      id="downloadBtn"
      class="downloadBtn"
      type="button">

      DOWNLOAD PNG

    </button>

  </div>

</section>


<script>

/* =========================================================
   HIGH QUALITY 2 × 2 OUTPUT
=========================================================

   2 inches × 2 inches
   300 DPI
   = 600 × 600 pixels

   The browser PNG itself does not always preserve a DPI
   metadata field, but the pixel dimensions are correct for
   a 2 × 2 inch print at 300 DPI.
========================================================= */

const OUTPUT_WIDTH = 600;
const OUTPUT_HEIGHT = 600;


/* =========================================================
   ELEMENTS
========================================================= */

const idScreen =
  document.getElementById("idScreen");

const cameraScreen =
  document.getElementById("cameraScreen");

const previewScreen =
  document.getElementById("previewScreen");

const studentId =
  document.getElementById("studentId");

const startBtn =
  document.getElementById("startBtn");

const switchBtn =
  document.getElementById("switchBtn");

const captureBtn =
  document.getElementById("captureBtn");

const retakeBtn =
  document.getElementById("retakeBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const video =
  document.getElementById("video");

const cameraStatus =
  document.getElementById("cameraStatus");

const cameraSelect =
  document.getElementById("cameraSelect");

const errorPanel =
  document.getElementById("errorPanel");

const errorText =
  document.getElementById("errorText");

const retryBtn =
  document.getElementById("retryBtn");

const previewImage =
  document.getElementById("previewImage");

const previewStudent =
  document.getElementById("previewStudent");

const previewStatus =
  document.getElementById("previewStatus");

const backgroundControls =
  document.getElementById("backgroundControls");

const removeBgBtn =
  document.getElementById("removeBgBtn");

const bgOptions =
  document.getElementById("bgOptions");

const transparentBtn =
  document.getElementById("transparentBtn");

const whiteBtn =
  document.getElementById("whiteBtn");

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");


/* =========================================================
   VARIABLES
========================================================= */

let stream = null;

let cameras = [];

let currentCameraIndex = 0;

let currentFacing = "environment";

let studentIDValue = "";

let capturedBlob = null;

let capturedURL = null;

let transparentBlob = null;

let whiteBlob = null;

let currentPhotoMode = "original";

let selfieSegmentation = null;

let segmentationReady = false;


/* =========================================================
   SCREEN CONTROL
========================================================= */

function showScreen(screen){

  idScreen.classList.remove("active");
  cameraScreen.classList.remove("active");
  previewScreen.classList.remove("active");

  screen.classList.add("active");

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(show,text){

  if(show){

    loading.classList.add("show");

    loadingText.textContent =
      text || "Please wait...";

  }else{

    loading.classList.remove("show");

  }

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  errorText.textContent = message;

  errorPanel.classList.add("show");

  cameraStatus.textContent =
    "Camera unavailable";

}

function hideError(){

  errorPanel.classList.remove("show");

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(){

  if(stream){

    stream.getTracks().forEach(track => {

      try{
        track.stop();
      }catch(e){}

    });

    stream = null;

  }

  video.srcObject = null;

}


/* =========================================================
   CAMERA SUPPORT
========================================================= */

function checkCameraSupport(){

  if(!window.isSecureContext){

    showError(
      "Camera access requires a secure HTTPS connection.\n\n" +
      "Open this Apps Script web app using its HTTPS URL."
    );

    return false;

  }

  if(!navigator.mediaDevices){

    showError(
      "This browser does not provide camera access.\n\n" +
      "Please use Chrome, Brave, Edge, or another modern browser."
    );

    return false;

  }

  if(!navigator.mediaDevices.getUserMedia){

    showError(
      "Camera access is not supported by this browser."
    );

    return false;

  }

  return true;

}


/* =========================================================
   GET CAMERAS
========================================================= */

async function getCameras(){

  try{

    const devices =
      await navigator.mediaDevices.enumerateDevices();

    cameras =
      devices.filter(
        device =>
          device.kind === "videoinput"
      );

    cameraSelect.innerHTML = "";

    cameras.forEach((camera,index)=>{

      const option =
        document.createElement("option");

      option.value =
        camera.deviceId;

      option.textContent =
        camera.label ||
        `Camera ${index + 1}`;

      cameraSelect.appendChild(option);

    });

    cameraSelect.style.display =
      cameras.length > 1
      ? "block"
      : "none";

    return cameras;

  }catch(error){

    console.error(
      "enumerateDevices error:",
      error
    );

    return [];

  }

}


/* =========================================================
   OPEN CAMERA
========================================================= */

async function openCamera(){

  if(!checkCameraSupport()){
    return false;
  }

  hideError();

  setLoading(
    true,
    "Requesting camera permission..."
  );

  stopCamera();

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          },

          facingMode:{
            ideal:currentFacing
          }

        },

        audio:false

      });

    video.srcObject =
      stream;

    await video.play();

    await getCameras();

    const track =
      stream.getVideoTracks()[0];

    const settings =
      track.getSettings();

    console.log(
      "Active camera:",
      settings
    );

    if(settings.facingMode){

      currentFacing =
        settings.facingMode;

    }

    cameraStatus.textContent =
      "Camera ready • Frame your face inside the square";

    setLoading(false);

    return true;

  }catch(error){

    console.error(
      "Camera start error:",
      error
    );

    setLoading(false);

    stopCamera();

    handleCameraError(error);

    return false;

  }

}


/* =========================================================
   OPEN SPECIFIC CAMERA
========================================================= */

async function openSpecificCamera(deviceId){

  if(!checkCameraSupport()){
    return false;
  }

  hideError();

  setLoading(
    true,
    "Switching camera..."
  );

  stopCamera();

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          deviceId:{
            exact:deviceId
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }

        },

        audio:false

      });

    video.srcObject =
      stream;

    await video.play();

    const track =
      stream.getVideoTracks()[0];

    const settings =
      track.getSettings();

    console.log(
      "Selected camera:",
      settings
    );

    if(settings.facingMode){

      currentFacing =
        settings.facingMode;

    }

    cameraStatus.textContent =
      "Camera ready";

    setLoading(false);

    return true;

  }catch(error){

    console.warn(
      "Exact camera failed:",
      error
    );

    try{

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{

            facingMode:{
              ideal:currentFacing
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }

          },

          audio:false

        });

      video.srcObject =
        stream;

      await video.play();

      cameraStatus.textContent =
        "Camera ready";

      setLoading(false);

      return true;

    }catch(secondError){

      console.error(
        secondError
      );

      setLoading(false);

      stopCamera();

      handleCameraError(secondError);

      return false;

    }

  }

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera(){

  hideError();

  if(cameras.length > 1){

    currentCameraIndex =
      (currentCameraIndex + 1)
      % cameras.length;

    const camera =
      cameras[currentCameraIndex];

    cameraSelect.value =
      camera.deviceId;

    await openSpecificCamera(
      camera.deviceId
    );

    return;

  }

  currentFacing =
    currentFacing === "environment"
    ? "user"
    : "environment";

  await openCamera();

}


/* =========================================================
   CAMERA ERROR
========================================================= */

function handleCameraError(error){

  let message =
    "Unable to start the camera.";

  switch(error.name){

    case "NotAllowedError":

      message =
        "Camera permission was denied.\n\n" +
        "Allow camera permission in your browser settings, then press TRY AGAIN.";

      break;

    case "NotFoundError":

      message =
        "No camera was found.\n\n" +
        "Check that the device has a working camera.";

      break;

    case "NotReadableError":

      message =
        "The camera exists, but the browser could not read it.\n\n" +
        "Another application may already be using the camera.";

      break;

    case "SecurityError":

      message =
        "The browser blocked camera access.\n\n" +
        "Make sure this page is running over HTTPS.";

      break;

    default:

      message =
        "Camera error:\n" +
        error.name +
        "\n\n" +
        (error.message ||
         "Unknown error.");

  }

  showError(message);

}


/* =========================================================
   HIGH QUALITY SQUARE CROP
========================================================= */

function drawSquareCrop(source,ctx){

  const sourceWidth =
    source.videoWidth ||
    source.naturalWidth ||
    source.width;

  const sourceHeight =
    source.videoHeight ||
    source.naturalHeight ||
    source.height;

  if(!sourceWidth || !sourceHeight){

    throw new Error(
      "Invalid camera image dimensions."
    );

  }

  /*
    Match CSS object-fit: cover.

    This ensures the preview framing and
    downloaded image use the same square crop.
  */

  const targetRatio = 1;

  const sourceRatio =
    sourceWidth /
    sourceHeight;

  let sx = 0;
  let sy = 0;

  let sw = sourceWidth;
  let sh = sourceHeight;

  if(sourceRatio > targetRatio){

    sw = sourceHeight;
    sx = (sourceWidth - sw) / 2;

  }else{

    sh = sourceWidth;
    sy = (sourceHeight - sh) / 2;

  }

  ctx.drawImage(
    source,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    OUTPUT_WIDTH,
    OUTPUT_HEIGHT
  );

}


/* =========================================================
   PNG CREATION
========================================================= */

function canvasToPNG(canvas){

  return new Promise((resolve,reject)=>{

    canvas.toBlob(
      blob => {

        if(blob){
          resolve(blob);
        }else{
          reject(
            new Error(
              "Browser could not create PNG."
            )
          );
        }

      },
      "image/png",
      1.0
    );

  });

}


/* =========================================================
   CAPTURE PHOTO
========================================================= */

async function capturePhoto(){

  if(!stream){

    showError(
      "Camera is not ready."
    );

    return;

  }

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    showError(
      "Camera image is not ready yet.\n\n" +
      "Please wait a moment and try again."
    );

    return;

  }

  captureBtn.disabled = true;

  cameraStatus.textContent =
    "Capturing high-quality 2 × 2 photo...";

  try{

    const canvas =
      document.createElement("canvas");

    /*
      EXACT OUTPUT:
      600 × 600 pixels
    */

    canvas.width =
      OUTPUT_WIDTH;

    canvas.height =
      OUTPUT_HEIGHT;

    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha:true,
          willReadFrequently:false
        }
      );

    /*
      Use the full available camera resolution
      and downsample only once into 600 × 600.
    */

    ctx.imageSmoothingEnabled =
      true;

    ctx.imageSmoothingQuality =
      "high";

    drawSquareCrop(
      video,
      ctx
    );

    capturedBlob =
      await canvasToPNG(canvas);

    if(!capturedBlob){

      throw new Error(
        "Could not create PNG."
      );

    }

    if(capturedURL){

      URL.revokeObjectURL(
        capturedURL
      );

    }

    capturedURL =
      URL.createObjectURL(
        capturedBlob
      );

    transparentBlob = null;
    whiteBlob = null;

    currentPhotoMode =
      "original";

    previewImage.src =
      capturedURL;

    previewStudent.textContent =
      "Student ID: " +
      studentIDValue;

    previewStatus.textContent =
      "Original photo • 600 × 600 px • 2 × 2 in @ 300 DPI";

    backgroundControls.classList.add(
      "show"
    );

    bgOptions.classList.remove(
      "show"
    );

    transparentBtn.classList.remove(
      "active"
    );

    whiteBtn.classList.remove(
      "active"
    );

    stopCamera();

    showScreen(
      previewScreen
    );

  }catch(error){

    console.error(
      "Capture error:",
      error
    );

    showError(
      "Unable to capture the photo.\n\n" +
      error.message
    );

  }finally{

    captureBtn.disabled =
      false;

  }

}


/* =========================================================
   INITIALIZE MEDIAPIPE
========================================================= */

async function initializeSegmentation(){

  if(segmentationReady){
    return;
  }

  try{

    selfieSegmentation =
      new SelfieSegmentation({

        locateFile:
          file =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`

      });

    selfieSegmentation.setOptions({
      modelSelection:1
    });

    await new Promise((resolve,reject)=>{

      let completed = false;

      selfieSegmentation.onResults(
        results => {

          if(!completed){

            completed = true;

            resolve(results);

          }

        }
      );

      const testCanvas =
        document.createElement("canvas");

      testCanvas.width = 10;
      testCanvas.height = 10;

      selfieSegmentation
        .send({
          image:testCanvas
        })
        .catch(reject);

    });

    segmentationReady = true;

    console.log(
      "Background removal ready"
    );

  }catch(error){

    console.error(
      "Segmentation initialization error:",
      error
    );

    segmentationReady = false;

  }

}


/* =========================================================
   REMOVE BACKGROUND
========================================================= */

async function removeBackground(){

  if(!capturedBlob){

    alert(
      "Please capture a photo first."
    );

    return;

  }

  setLoading(
    true,
    "Removing background..."
  );

  removeBgBtn.disabled =
    true;

  try{

    await initializeSegmentation();

    if(!segmentationReady){

      throw new Error(
        "Background removal engine could not be loaded."
      );

    }

    const sourceImage =
      new Image();

    const sourceURL =
      URL.createObjectURL(
        capturedBlob
      );

    await new Promise(
      (resolve,reject)=>{

        sourceImage.onload =
          resolve;

        sourceImage.onerror =
          reject;

        sourceImage.src =
          sourceURL;

      }
    );

    const canvas =
      document.createElement("canvas");

    canvas.width =
      OUTPUT_WIDTH;

    canvas.height =
      OUTPUT_HEIGHT;

    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha:true
        }
      );

    const result =
      await runSegmentation(
        sourceImage
      );

    ctx.clearRect(
      0,
      0,
      OUTPUT_WIDTH,
      OUTPUT_HEIGHT
    );

    ctx.drawImage(
      sourceImage,
      0,
      0,
      OUTPUT_WIDTH,
      OUTPUT_HEIGHT
    );

    const imageData =
      ctx.getImageData(
        0,
        0,
        OUTPUT_WIDTH,
        OUTPUT_HEIGHT
      );

    const maskCanvas =
      document.createElement("canvas");

    maskCanvas.width =
      OUTPUT_WIDTH;

    maskCanvas.height =
      OUTPUT_HEIGHT;

    const maskCtx =
      maskCanvas.getContext(
        "2d"
      );

    maskCtx.drawImage(
      result.segmentationMask,
      0,
      0,
      OUTPUT_WIDTH,
      OUTPUT_HEIGHT
    );

    const maskData =
      maskCtx.getImageData(
        0,
        0,
        OUTPUT_WIDTH,
        OUTPUT_HEIGHT
      );

    for(
      let i = 0;
      i < imageData.data.length;
      i += 4
    ){

      const maskValue =
        maskData.data[i];

      let alpha;

      if(maskValue < 15){

        alpha = 0;

      }else if(maskValue > 150){

        alpha = 255;

      }else{

        alpha =
          (
            (maskValue - 15) /
            (150 - 15)
          ) * 255;

      }

      imageData.data[i + 3] =
        Math.round(alpha);

    }

    ctx.putImageData(
      imageData,
      0,
      0
    );

    transparentBlob =
      await canvasToPNG(canvas);

    URL.revokeObjectURL(
      sourceURL
    );

    if(capturedURL){

      URL.revokeObjectURL(
        capturedURL
      );

    }

    capturedURL =
      URL.createObjectURL(
        transparentBlob
      );

    capturedBlob =
      transparentBlob;

    previewImage.src =
      capturedURL;

    currentPhotoMode =
      "transparent";

    previewStatus.textContent =
      "Background removed • 600 × 600 px";

    bgOptions.classList.add(
      "show"
    );

    transparentBtn.classList.add(
      "active"
    );

    whiteBtn.classList.remove(
      "active"
    );

  }catch(error){

    console.error(
      "Background removal error:",
      error
    );

    alert(
      "Background removal failed.\n\n" +
      error.message
    );

  }finally{

    setLoading(false);

    removeBgBtn.disabled =
      false;

  }

}


/* =========================================================
   RUN SEGMENTATION
========================================================= */

function runSegmentation(image){

  return new Promise(
    (resolve,reject)=>{

      let finished = false;

      const handler =
        results => {

          if(finished){
            return;
          }

          finished = true;

          resolve(results);

        };

      selfieSegmentation.onResults(
        handler
      );

      selfieSegmentation
        .send({
          image:image
        })
        .catch(error => {

          if(!finished){

            finished = true;

            reject(error);

          }

        });

    }
  );

}


/* =========================================================
   WHITE BACKGROUND
========================================================= */

async function applyWhiteBackground(){

  if(!transparentBlob){

    alert(
      "Remove the background first."
    );

    return;

  }

  setLoading(
    true,
    "Creating white background..."
  );

  try{

    const image =
      new Image();

    const sourceURL =
      URL.createObjectURL(
        transparentBlob
      );

    await new Promise(
      (resolve,reject)=>{

        image.onload =
          resolve;

        image.onerror =
          reject;

        image.src =
          sourceURL;

      }
    );

    const canvas =
      document.createElement("canvas");

    canvas.width =
      OUTPUT_WIDTH;

    canvas.height =
      OUTPUT_HEIGHT;

    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha:false
        }
      );

    ctx.fillStyle =
      "#ffffff";

    ctx.fillRect(
      0,
      0,
      OUTPUT_WIDTH,
      OUTPUT_HEIGHT
    );

    ctx.drawImage(
      image,
      0,
      0,
      OUTPUT_WIDTH,
      OUTPUT_HEIGHT
    );

    whiteBlob =
      await canvasToPNG(canvas);

    URL.revokeObjectURL(
      sourceURL
    );

    if(!whiteBlob){

      throw new Error(
        "Could not create white-background PNG."
      );

    }

    const whiteURL =
      URL.createObjectURL(
        whiteBlob
      );

    if(capturedURL){

      URL.revokeObjectURL(
        capturedURL
      );

    }

    capturedURL =
      whiteURL;

    capturedBlob =
      whiteBlob;

    previewImage.src =
      whiteURL;

    currentPhotoMode =
      "white";

    previewStatus.textContent =
      "White background • 600 × 600 px";

    whiteBtn.classList.add(
      "active"
    );

    transparentBtn.classList.remove(
      "active"
    );

  }catch(error){

    console.error(
      "White background error:",
      error
    );

    alert(
      "Could not create white background.\n\n" +
      error.message
    );

  }finally{

    setLoading(false);

  }

}


/* =========================================================
   SHOW TRANSPARENT
========================================================= */

function showTransparent(){

  if(!transparentBlob){

    alert(
      "Remove the background first."
    );

    return;

  }

  if(capturedURL){

    URL.revokeObjectURL(
      capturedURL
    );

  }

  capturedURL =
    URL.createObjectURL(
      transparentBlob
    );

  capturedBlob =
    transparentBlob;

  previewImage.src =
    capturedURL;

  currentPhotoMode =
    "transparent";

  previewStatus.textContent =
    "Background removed • 600 × 600 px";

  transparentBtn.classList.add(
    "active"
  );

  whiteBtn.classList.remove(
    "active"
  );

}


/* =========================================================
   SAFE FILE NAME
========================================================= */

function createSafeFilename(id){

  const safeID =
    id
      .trim()
      .replace(
        /[^a-zA-Z0-9_-]/g,
        ""
      );

  if(!safeID){
    return null;
  }

  return safeID + "_2x2.png";

}


/* =========================================================
   DOWNLOAD HIGH QUALITY PNG
========================================================= */

async function downloadPhoto(){

  if(!capturedBlob){

    alert(
      "There is no captured photo."
    );

    return;

  }

  if(!studentIDValue){

    alert(
      "Student ID is missing."
    );

    return;

  }

  const filename =
    createSafeFilename(
      studentIDValue
    );

  if(!filename){

    alert(
      "Invalid Student ID."
    );

    return;

  }

  setLoading(
    true,
    "Preparing high-quality download..."
  );

  downloadBtn.disabled =
    true;

  try{

    /*
      Verify the final PNG exists and
      has the expected dimensions before
      downloading.
    */

    const verificationImage =
      new Image();

    const verificationURL =
      URL.createObjectURL(
        capturedBlob
      );

    await new Promise(
      (resolve,reject)=>{

        verificationImage.onload =
          resolve;

        verificationImage.onerror =
          reject;

        verificationImage.src =
          verificationURL;

      }
    );

    if(
      verificationImage.naturalWidth !==
      OUTPUT_WIDTH ||
      verificationImage.naturalHeight !==
      OUTPUT_HEIGHT
    ){

      throw new Error(
        `Unexpected image size: ` +
        `${verificationImage.naturalWidth} × ` +
        `${verificationImage.naturalHeight}`
      );

    }

    URL.revokeObjectURL(
      verificationURL
    );

    /*
      Create a fresh download URL.
      This avoids using the preview URL
      and guarantees the final selected
      Blob is downloaded.
    */

    const downloadURL =
      URL.createObjectURL(
        capturedBlob
      );

    const link =
      document.createElement("a");

    link.href =
      downloadURL;

    link.download =
      filename;

    link.rel =
      "noopener";

    link.style.display =
      "none";

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    /*
      Give the browser time to begin
      the download before revoking.
    */

    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          downloadURL
        );
      },
      5000
    );

    setLoading(
      false
    );

    /*
      Reset after download.
    */

    setTimeout(
      ()=>{
        resetEverything();

        showScreen(
          idScreen
        );

        studentId.focus();

      },
      700
    );

  }catch(error){

    console.error(
      "Download error:",
      error
    );

    setLoading(
      false
    );

    alert(
      "Download failed.\n\n" +
      error.message
    );

  }finally{

    downloadBtn.disabled =
      false;

  }

}


/* =========================================================
   RETAKE
========================================================= */

async function retakePhoto(){

  capturedBlob = null;

  transparentBlob = null;

  whiteBlob = null;

  if(capturedURL){

    URL.revokeObjectURL(
      capturedURL
    );

    capturedURL = null;

  }

  previewImage.removeAttribute(
    "src"
  );

  backgroundControls.classList.remove(
    "show"
  );

  bgOptions.classList.remove(
    "show"
  );

  transparentBtn.classList.remove(
    "active"
  );

  whiteBtn.classList.remove(
    "active"
  );

  previewStatus.textContent =
    "";

  showScreen(
    cameraScreen
  );

  await openCamera();

}


/* =========================================================
   RESET
========================================================= */

function resetEverything(){

  stopCamera();

  hideError();

  capturedBlob = null;

  transparentBlob = null;

  whiteBlob = null;

  if(capturedURL){

    URL.revokeObjectURL(
      capturedURL
    );

    capturedURL = null;

  }

  previewImage.removeAttribute(
    "src"
  );

  backgroundControls.classList.remove(
    "show"
  );

  bgOptions.classList.remove(
    "show"
  );

  transparentBtn.classList.remove(
    "active"
  );

  whiteBtn.classList.remove(
    "active"
  );

  previewStudent.textContent =
    "";

  previewStatus.textContent =
    "Original photo • 600 × 600 px";

  studentIDValue =
    "";

  studentId.value =
    "";

  cameras =
    [];

  currentCameraIndex =
    0;

  currentFacing =
    "environment";

}

   START
========================================================= */

startBtn.addEventListener(
  "click",
  async ()=>{

    const id =
      studentId.value.trim();

    if(!id){

      alert(
        "Please enter the Student ID."
      );

      studentId.focus();

      return;

    }

    studentIDValue =
      id;

    showScreen(
      cameraScreen
    );

    await openCamera();

  }
);

   ENTER KEY
========================================================= */

studentId.addEventListener(
  "keydown",
  event => {

      event.preventDefault();

      startBtn.click();

    }

  }
);

   SWITCH
========================================================= */

switchBtn.addEventListener(
  "click",

  }
);

   CAMERA SELECT
========================================================= */

cameraSelect.addEventListener(
  "change",

    const deviceId =

    if(!deviceId){
      return;
    }

    await openSpecificCamera(
      deviceId
    );

  }
);


/* =========================================================
   CAPTURE
========================================================= */

captureBtn.addEventListener(
  "click",
  capturePhoto
);


/* =========================================================
   BACKGROUND
========================================================= */

removeBgBtn.addEventListener(
  "click",
  removeBackground
);

transparentBtn.addEventListener(
  "click",
  showTransparent
);

whiteBtn.addEventListener(
  "click",
  applyWhiteBackground
);

   RETAKE
========================================================= */

retakeBtn.addEventListener(
  "click",
  retakePhoto
);


/* =========================================================
   DOWNLOAD
========================================================= */

downloadBtn.addEventListener(
  "click",
  downloadPhoto
);


/* =========================================================
   RETRY
========================================================= */

retryBtn.addEventListener(
  "click",
  async ()=>{

    hideError();

    await openCamera();

  }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      stopCamera();

    }

  }
);


/* =========================================================
   DEVICE CHANGE
========================================================= */

if(navigator.mediaDevices){

  navigator.mediaDevices.addEventListener(
    "devicechange",
    async ()=>{

      if(stream){

        await getCameras();

      }

    }
  );

}


/* =========================================================
   INITIAL STATE
========================================================= */

window.addEventListener(
  "load",
  ()=>{

    studentId.focus();

  }
);
