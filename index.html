<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delivery Note</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .no-print {
      margin: 10px 0;
    }

    @media print {
      .no-print {
        display: none !important;
      }
    }

    #serialList {
      list-style-type: none;
      padding-left: 0;
    }

    #serialList li {
      margin-bottom: 5px;
    }

    #totalBox {
      border: 1px solid #000;
      padding: 10px;
      margin-top: 20px;
      width: fit-content;
      font-weight: bold;
    }

    #signatureBox {
      margin-top: 30px;
    }

    #signatureCanvas {
      border: 1px solid #000;
      width: 100%;
      height: 150px;
    }

    .big-button {
      font-size: 20px;
      padding: 14px 24px;
      border-radius: 8px;
      min-width: 160px;
      min-height: 48px;
    }
  </style>
</head>
<body>

  <h2>Delivery Note</h2>

  <input type="text" id="serialInput" placeholder="Scan or enter serial" autofocus class="no-print">

  <button class="big-button no-print" onclick="addSerial()">Add Serial</button>
  <button class="big-button no-print" onclick="scanQR()">Scan QR/Barcode</button>
  <button class="big-button no-print" onclick="exportPDF()">Export as PDF</button>
  <button class="big-button no-print" onclick="window.print()">Print</button>

  <ul id="serialList"></ul>

  <div id="totalBox">
    Total: <span id="totalCount">0</span>
  </div>

  <div id="signatureBox">
    <label>Receiver Signature:</label>
    <canvas id="signatureCanvas"></canvas>
  </div>

  <script>
    let serials = [];

    function addSerial() {
      const input = document.getElementById("serialInput");
      const value = input.value.trim();
      if (value) {
        serials.push(value);
        updateSerialList();
        input.value = "";
        input.focus();
      }
    }

    function updateSerialList() {
      const list = document.getElementById("serialList");
      list.innerHTML = "";
      serials.forEach((serial, index) => {
        const item = document.createElement("li");
        item.textContent = `${index + 1}. ${serial}`;
        list.appendChild(item);
      });
      document.getElementById("totalCount").textContent = serials.length;
    }

    function scanQR() {
      alert("QR scanning is handled by external scanner or native app.");
    }

    function exportPDF() {
      alert("PDF export logic goes here (e.g., html2pdf.js).");
    }
  </script>

</body>
</html>
