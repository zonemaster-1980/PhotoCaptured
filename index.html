<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delivery Note</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('./bp.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      padding: 20px;
      max-width: 520px;
      margin: auto;
    }

    h2 {
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 8px;
      margin: 10px 5px 0 0;
      border-radius: 6px;
      width: 48%;
      font-weight: bold;
      cursor: pointer;
    }

    #serials {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      margin-top: 10px;
      margin-bottom: 10px;
      padding-left: 0;
      list-style: none;
    }

    #serials li {
      font-size: 14px;
      padding-left: 20px;
      position: relative;
    }

    #serials li::before {
      content: attr(data-index) ". ";
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    #serials.three-column {
      grid-template-columns: repeat(3, 1fr);
    }

    #totalCount {
      font-weight: bold;
      color: red;
      margin-top: 5px;
    }

  .print-hide {
  display: block;
}

@media print {
  .print-hide {
    display: none !important;
  }
}


      #serials {
        max-height: none !important;
        overflow: visible !important;
        page-break-inside: avoid;
      }

      #serials.three-column {
        grid-template-columns: repeat(3, 1fr) !important;
      }
    }

    #note.hide-buttons button {
      display: none !important;
    }

    @page {
      size: A4;
      margin: 10mm;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div id="note">
    <h2>DELIVERY NOTE</h2>
    <p><strong>Note #:</strong> <span id="noteNumber"></span></p>
    <p><strong>Date:</strong> <span id="noteDate"></span></p>

    <label>From:</label>
    <input type="text" id="fromField" placeholder="Enter sender name" />

    <label>To:</label>
    <input type="text" id="toField" placeholder="Enter recipient name" />

    <p><strong>Model Unit:</strong> Lenovo Chromebook</p>
    <hr/>

    <label>Serial Number:</label>
    <input type="text" id="serialInput" placeholder="Enter serial number" />
    <button onclick="addSerial()">Add Serial</button>
    <button onclick="clearSerials()">Clear Serials</button>

    <ul id="serials"></ul>
    <p id="totalCount">Total: 0</p>
    <hr/>

    <p><strong>Received By:</strong> ___________________</p>
    <hr/>

    <button onclick="exportPDF()">Export as PDF</button>
    <button onclick="window.print()">Print</button>
  </div>

  <div class="print-hide">
  <label>Serial Number:</label>
  <input type="text" id="serialInput" placeholder="Enter serial number" />
  <button onclick="addSerial()">Add Serial</button>
  <button onclick="clearSerials()">Clear Serials</button>
</div>

  <script>
    document.getElementById('noteNumber').textContent = 'DN-' + Date.now();
    document.getElementById('noteDate').textContent = new Date().toISOString().split('T')[0];

    document.getElementById('serialInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') addSerial();
    });

    function addSerial(value = null) {
      const input = document.getElementById('serialInput');
      const sn = value || input.value.trim();
      if (sn) {
        const serialsList = document.getElementById('serials');
        const li = document.createElement('li');
        const count = serialsList.children.length + 1;
        li.textContent = sn;
        li.setAttribute('data-index', count);
        serialsList.appendChild(li);
        input.value = '';
        updateTotal();

        if (serialsList.children.length > 10) {
          serialsList.classList.add('three-column');
        } else {
          serialsList.classList.remove('three-column');
        }
      }
    }

    function clearSerials() {
      const serialsList = document.getElementById('serials');
      serialsList.innerHTML = '';
      updateTotal();
      serialsList.classList.remove('three-column');
    }

    function updateTotal() {
      const total = document.getElementById('serials').children.length;
      document.getElementById('totalCount').textContent = 'Total: ' + total;
    }

    function exportPDF() {
      document.activeElement.blur();
      const note = document.getElementById('note');
      note.classList.add('hide-buttons');

      const opt = {
        margin: 10,
        filename: 'delivery_note.pdf',
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        html2canvas: { scale: 2 }
      };

      setTimeout(() => {
        html2pdf().set(opt).from(note).save().then(() => {
          note.classList.remove('hide-buttons');
        });
      }, 100);
    }
  </script>
</body>
</html>
