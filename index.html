<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delivery Note</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 520px; /* A5 width in pixels at 96dpi */
      margin: auto;
    }
    input, button, canvas {
      margin: 5px 0;
      width: 100%;
    }
    #serials li {
      margin-bottom: 5px;
    }
    #signature-pad {
      border: 1px solid #ccc;
    }

    @media print {
      button {
        display: none !important;
      }
    }

    @page {
      size: A5;
      margin: 10mm;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <h2>Delivery Note</h2>
  <div id="note">
    <p><strong>Note #:</strong> <span id="noteNumber"></span></p>
    <p><strong>Date:</strong> <span id="noteDate"></span></p>
    <label>To: <input type="text" id="toField" /></label>
    <label>From: <input type="text" id="fromField" /></label>
    <p><strong>Model Unit:</strong> Lenovo Chromebook</p>
    <hr/>
    <label>Serial Number: <input type="text" id="serialInput" /></label>
    <button onclick="addSerial()">Add Serial</button>
    <ul id="serials"></ul>
    <hr/>
    <p><strong>Signature of Receiver:</strong></p>
    <canvas id="signature-pad" width="500" height="150"></canvas>
    <button onclick="clearSignature()">Clear Signature</button>
    <hr/>
    <button onclick="exportPDF()">Export as PDF</button>
    <button onclick="window.print()">Print</button>
  </div>

  <script>
    document.getElementById('noteNumber').textContent = 'DN-' + Date.now();
    document.getElementById('noteDate').textContent = new Date().toISOString().split('T')[0];

    function addSerial(value = null) {
      const input = document.getElementById('serialInput');
      const sn = value || input.value.trim();
      if (sn) {
        const li = document.createElement('li');
        li.textContent = sn;
        document.getElementById('serials').appendChild(li);
        input.value = '';
      }
    }

    // Signature pad
    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => {
      drawing = false;
      ctx.beginPath();
    });
    canvas.addEventListener('mousemove', draw);
    function draw(e) {
      if (!drawing) return;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    }
    function clearSignature() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Export PDF
    function exportPDF() {
      const opt = {
        margin: 10,
        filename: 'delivery_note.pdf',
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
        jsPDF: { unit: 'mm', format: 'a5', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(document.getElementById('note')).save();
    }
  </script>
</body>
</html>
