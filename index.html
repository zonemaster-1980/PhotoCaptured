<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no,
            viewport-fit=cover">

<meta name="theme-color" content="#080b0d">

<title>DJIS ID Photo Booth</title>




<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#080b0d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:600px;
    min-height:100vh;
    background:#0d1114;
    position:relative;
    overflow:hidden;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    height:70px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#11171b;
    border-bottom:1px solid #20282d;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#111;
    font-size:20px;
    font-weight:900;
}

.title{
    font-size:17px;
    font-weight:800;
    letter-spacing:.3px;
}

.subtitle{
    font-size:11px;
    color:#8b989f;
    margin-top:3px;
}

.status{
    font-size:10px;
    color:#56d364;
    font-weight:700;
}

/* =========================================================
   SCREENS
   ========================================================= */

.screen{
    width:100%;
    min-height:calc(100vh - 70px);
}

.hidden{
    display:none !important;
}

/* =========================================================
   START SCREEN — MINIMAL DJIS MOBILE THEME
   ========================================================= */

.start-screen{
    min-height:100vh;
    padding:24px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080b0d;
}

.start-content{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:translateY(-1vh);
}

.brand-mark{
    margin:0;
    color:#fff;
    font-size:32px;
    line-height:1;
    font-weight:900;
    letter-spacing:.3px;
}

.brand-subtitle{
    margin-top:13px;
    color:#9aa7b0;
    font-size:13px;
    line-height:1;
    letter-spacing:.15px;
    font-weight:400;
}

.start-id-input{
    width:100%;
    height:58px;
    margin-top:36px;
    padding:0 20px;
    border-radius:14px;
    border:1px solid #29353c;
    background:#11171b;
    color:#fff;
    text-align:center;
    font-size:21px;
    font-weight:400;
    outline:none;
    box-shadow:none;
}

.start-id-input::placeholder{
    color:#71808a;
    opacity:1;
}

.start-id-input:focus{
    border-color:#3b4a53;
    box-shadow:0 0 0 2px rgba(56,207,243,.08);
}

.start-capture-btn{
    width:100%;
    height:58px;
    margin-top:18px;
    border:0;
    border-radius:14px;
    background:#38cef3;
    color:#071014;
    font-size:16px;
    font-weight:900;
    letter-spacing:.15px;
    cursor:pointer;
    box-shadow:none;
}

.start-capture-btn:active{
    transform:scale(.985);
}

.start-help{
    margin-top:20px;
    color:#70808a;
    text-align:center;
    font-size:12px;
    line-height:1.55;
}

/* The reference start screen is intentionally distraction-free. */
.app.start-mode .header{
    display:none;
}

.app.start-mode .screen{
    min-height:100vh;
}

@media (max-width:480px){
    .start-screen{
        padding:20px 22px;
    }

    .brand-mark{
        font-size:31px;
    }

    .start-id-input,
    .start-capture-btn{
        height:56px;
    }
}

@media (max-height:600px){
    .start-id-input{
        margin-top:30px;
    }

    .start-help{
        margin-top:16px;
    }
}

/* =========================================================
   CAMERA SCREEN
   ========================================================= */

.camera-screen{
    height:calc(100svh - 70px);
    min-height:0;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

.camera-top{
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0d1114;
    border-bottom:1px solid #1d252a;
}

.student-label{
    font-size:13px;
    font-weight:800;
}

.camera-label{
    font-size:10px;
    color:#6e7b82;
    margin-top:3px;
}

.camera-select{
    max-width:180px;
    height:38px;
    background:#151c20;
    color:#fff;
    border:1px solid #303a40;
    border-radius:9px;
    padding:0 8px;
}

/* =========================================================
   CAMERA AREA
   ========================================================= */

.camera-area{
    flex:1;
    min-height:0;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    overflow:hidden;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* 7:9 GUIDE */

.photo-guide{
    position:absolute;
    width:min(78vw,350px);
    aspect-ratio:7 / 9;
    border:3px solid rgba(255,255,255,.9);
    border-radius:8px;
    pointer-events:none;
    box-shadow:
        0 0 0 9999px rgba(0,0,0,.45);
}

.guide-label{
    position:absolute;
    bottom:calc(50% - min(78vw,350px) * 9 / 14 - 30px);
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.65);
    border-radius:20px;
    padding:6px 12px;
    font-size:10px;
    color:#fff;
    white-space:nowrap;
}

/* =========================================================
   CAMERA CONTROLS
   ========================================================= */

.camera-controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    padding:14px 18px calc(18px + env(safe-area-inset-bottom));
    pointer-events:none;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.72),
        rgba(0,0,0,0)
    );
}

.capture-btn{
    width:78px;
    height:78px;
    flex:0 0 78px;
    border:5px solid rgba(255,255,255,.95);
    border-radius:50%;
    background:#fff;
    color:#080b0d;
    font-size:0;
    font-weight:900;
    cursor:pointer;
    pointer-events:auto;
    box-shadow:
        0 4px 18px rgba(0,0,0,.45),
        inset 0 0 0 2px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s ease,opacity .12s ease;
}

.capture-btn::before{
    content:"";
    width:58px;
    height:58px;
    border-radius:50%;
    background:#fff;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}

.capture-btn:active{
    transform:scale(.91);
}

.capture-btn:disabled{
    opacity:.5;
    pointer-events:none;
}

.switch-btn{
    width:48px;
    height:48px;
    margin:0;
    padding:0;
    border:1px solid rgba(255,255,255,.35);
    border-radius:50%;
    background:rgba(13,17,20,.82);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    pointer-events:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(8px);
}

/* =========================================================
   PREVIEW SCREEN
   ========================================================= */

.preview-screen{
    padding:18px;
    min-height:calc(100vh - 70px);
    overflow:auto;
}

.preview-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.preview-title{
    font-size:18px;
    font-weight:900;
}

.preview-status{
    font-size:10px;
    color:#7f8b91;
}

/* =========================================================
   PHOTO PREVIEW
   ========================================================= */

.preview-container{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:18px;
}

.photo-wrapper{
    position:relative;
    width:min(78vw,350px);
    aspect-ratio:7 / 9;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.photo-wrapper.transparent{
    background-color:#fff;

    background-image:
        linear-gradient(45deg,#d8d8d8 25%,transparent 25%),
        linear-gradient(-45deg,#d8d8d8 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#d8d8d8 75%),
        linear-gradient(-45deg,transparent 75%,#d8d8d8 75%);

    background-size:20px 20px;

    background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;
}

#previewImage{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =========================================================
   ACTION BUTTONS
   ========================================================= */

.actions{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.action-btn{
    width:100%;
    min-height:52px;
    border-radius:12px;
    border:1px solid #303a40;
    background:#151b1f;
    color:#fff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.action-btn:active{
    transform:scale(.98);
}

.action-btn:disabled{
    opacity:.55;
    cursor:default;
}

/* REMOVE BACKGROUND */

.remove-bg-btn{
    background:#fff;
    color:#080b0d;
    border-color:#fff;
    font-size:15px;
}

/* WHITE BACKGROUND */

.white-bg-btn{
    background:#fff;
    color:#111;
    border-color:#fff;
    display:none;
}

/* DOWNLOAD */

.download-btn{
    background:#56d364;
    color:#071008;
    border-color:#56d364;
    font-size:15px;
}

/* PORTAL */

.upload-portal-btn{
    background:#2f81f7;
    color:#fff;
    border-color:#2f81f7;
    font-size:15px;
}

.upload-portal-btn:active{
    background:#1f6ed4;
}

/* RETAKE */

.retake-btn{
    background:#151b1f;
}

/* =========================================================
   BACKGROUND OPTIONS
   ========================================================= */

.background-options{
    display:none;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
}

.background-options button{
    min-height:45px;
    border-radius:10px;
    border:1px solid #303a40;
    background:#151b1f;
    color:#fff;
    font-size:12px;
    font-weight:800;
}

.background-options button.active{
    background:#fff;
    color:#080b0d;
}

.ai-settings-btn{
    min-height:42px;
    background:#11171b;
    color:#9aa7b0;
    border-color:#29353c;
    font-size:11px;
}

.ai-settings-btn:active{
    background:#182126;
}

.ai-token-modal{
    position:fixed;
    inset:0;
    z-index:1100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.78);
}

.ai-token-modal.show{
    display:flex;
}

.ai-token-box{
    width:100%;
    max-width:380px;
    padding:22px;
    border:1px solid #303a40;
    border-radius:18px;
    background:#11171b;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.ai-token-title{
    font-size:16px;
    font-weight:900;
}

.ai-token-text{
    margin-top:8px;
    color:#7f8b91;
    font-size:11px;
    line-height:1.55;
}

.ai-token-input{
    width:100%;
    height:48px;
    margin-top:15px;
    padding:0 13px;
    border:1px solid #303a40;
    border-radius:10px;
    outline:none;
    background:#0d1114;
    color:#fff;
    font-size:13px;
}

.ai-token-input:focus{
    border-color:#38cef3;
}

.ai-token-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px;
}

.ai-token-actions button{
    min-height:45px;
    border-radius:10px;
    border:1px solid #303a40;
    background:#151b1f;
    color:#fff;
    font-weight:800;
    cursor:pointer;
}

.ai-token-save{
    background:#38cef3 !important;
    color:#071014 !important;
    border-color:#38cef3 !important;
}

.ai-token-link{
    display:block;
    margin-top:12px;
    color:#38cef3;
    text-align:center;
    font-size:11px;
    text-decoration:none;
}

/* =========================================================
   PROCESSING
   ========================================================= */

.processing{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.processing.show{
    display:flex;
}

.processing-box{
    width:100%;
    max-width:330px;
    background:#11171b;
    border:1px solid #303a40;
    border-radius:18px;
    padding:25px;
    text-align:center;
}

.spinner{
    width:42px;
    height:42px;
    border-radius:50%;
    border:4px solid #303a40;
    border-top-color:#fff;
    animation:spin .8s linear infinite;
    margin:0 auto 16px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.processing-title{
    font-weight:900;
    font-size:15px;
}

.processing-text{
    margin-top:6px;
    color:#7f8b91;
    font-size:11px;
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:380px){

    .capture-btn{
        width:70px;
        height:70px;
        flex-basis:70px;
    }

    .capture-btn::before{
        width:52px;
        height:52px;
    }

    .switch-btn{
        width:44px;
        height:44px;
        font-size:18px;
    }

    .header{
        height:62px;
    }

    .screen{
        min-height:calc(100vh - 62px);
    }

    .camera-screen,
    .preview-screen{
        min-height:calc(100vh - 62px);
    }

    .camera-screen{
        height:calc(100svh - 62px);
    }

    .logo{
        width:36px;
        height:36px;
        font-size:17px;
    }

    .title{
        font-size:14px;
    }

    .card{
        padding:18px;
    }

}

</style>

</head>

<body>

<div class="app start-mode">

<!-- HEADER -->

<header class="header">

    <div class="logo-area">

        <div class="logo">
            DJ
        </div>

        <div>

            <div class="title">
                DJIS ID Photo Booth
            </div>

            <div class="subtitle">
                Student Identification Photo
            </div>

        </div>

    </div>

    <div class="status">
        ● READY
    </div>

</header>


<!-- START SCREEN -->

<section
    id="startScreen"
    class="screen start-screen">

    <div class="start-content">

        <div class="brand-mark">
            DJIS
        </div>

        <div class="brand-subtitle">
            ID PHOTO BOOTH
        </div>

        <input
            id="studentID"
            class="start-id-input"
            type="text"
            placeholder="Enter Student ID"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false">

        <button
            id="startBtn"
            class="primary-btn start-capture-btn">
            START CAPTURE
        </button>

        <div class="start-help">
            <div>Enter the ID number first.</div>
            <div>The ID will be used only for the downloaded filename.</div>
        </div>

    </div>

</section>


<!-- CAMERA SCREEN -->

<section
    id="cameraScreen"
    class="screen camera-screen hidden">

    <div class="camera-top">

        <div>

            <div
                id="cameraStudent"
                class="student-label">

                STUDENT

            </div>

            <div class="camera-label">
                Position face and shoulders inside the frame
            </div>

        </div>

        <select
            id="cameraSelect"
            class="camera-select"
            style="display:none;">
        </select>

    </div>


    <div class="camera-area">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <div
            id="photoGuide"
            class="photo-guide">
        </div>

        <div class="guide-label">
            7 : 9 PHOTO AREA
        </div>

    </div>


    <div class="camera-controls">

        <button
            id="captureBtn"
            class="capture-btn">

            📸 CAPTURE

        </button>

        <button
            id="switchCameraBtn"
            class="switch-btn">

            🔄 SWITCH CAMERA

        </button>

    </div>

</section>


<!-- PREVIEW SCREEN -->

<section
    id="previewScreen"
    class="screen preview-screen hidden">

    <div class="preview-header">

        <div>

            <div class="preview-title">
                Photo Preview
            </div>

            <div
                id="previewStudent"
                class="preview-status">

                STUDENT

            </div>

        </div>

        <div
            id="previewStatus"
            class="preview-status">

            ORIGINAL

        </div>

    </div>


    <!-- PHOTO -->

    <div class="preview-container">

        <div
            id="photoWrapper"
            class="photo-wrapper">

            <img
                id="previewImage"
                alt="Student photo">

        </div>

    </div>


    <!-- BACKGROUND OPTIONS -->

    <div
        id="backgroundOptions"
        class="background-options">

        <button
            id="transparentBtn"
            class="active">

            TRANSPARENT

        </button>

        <button
            id="whiteOptionBtn">

            WHITE BACKGROUND

        </button>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

        <button
            id="aiSettingsBtn"
            class="action-btn ai-settings-btn"
            type="button"
            title="Configure cloud background-removal API token">
            ⚙ AI TOKEN SETTINGS
        </button>

        <button
            id="removeBgBtn"
            class="action-btn remove-bg-btn">

            ✨ REMOVE BACKGROUND

        </button>


        <button
            id="whiteBgBtn"
            class="action-btn white-bg-btn">

            ⬜ WHITE BACKGROUND

        </button>


        <!-- DOWNLOAD NOW ALSO OPENS PORTAL -->

        <button
            id="downloadBtn"
            class="action-btn download-btn">

            ⬇ DOWNLOAD PNG + OPEN PORTAL

        </button>


        <!-- MANUAL PORTAL BUTTON -->

        <button
            id="uploadPortalBtn"
            class="action-btn upload-portal-btn">

            ☁ OPEN DJIS PORTAL

        </button>


        <button
            id="retakeBtn"
            class="action-btn retake-btn">

            ↻ RETAKE PHOTO

        </button>

    </div>

</section>

</div>

<!-- CLOUD AI TOKEN MODAL IS CREATED ON DEMAND BY JAVASCRIPT -->

<!-- PROCESSING OVERLAY -->

<div
    id="processing"
    class="processing">

<div class="processing-box">

    <div class="spinner"></div>

    <div
        id="processingTitle"
        class="processing-title">

        Processing Photo

    </div>

    <div
        id="processingText"
        class="processing-text">

        Please wait...

    </div>

</div>

</div>

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const OUTPUT_WIDTH = 350;
const OUTPUT_HEIGHT = 450;


/* =========================================================
   DJIS PORTAL CONFIGURATION
   ========================================================= */

const PORTAL_BASE_URL =
    "https://portal.djis.edu.sa/IT/Upload.aspx";

const SCHOOL_YEAR =
    "2026-2027";


/* =========================================================
   ELEMENTS
   ========================================================= */

const startScreen =
    document.getElementById("startScreen");

const cameraScreen =
    document.getElementById("cameraScreen");

const previewScreen =
    document.getElementById("previewScreen");

const studentIDInput =
    document.getElementById("studentID");

const startBtn =
    document.getElementById("startBtn");

const captureBtn =
    document.getElementById("captureBtn");

const switchCameraBtn =
    document.getElementById("switchCameraBtn");

const cameraSelect =
    document.getElementById("cameraSelect");

const video =
    document.getElementById("video");

const previewImage =
    document.getElementById("previewImage");

const photoWrapper =
    document.getElementById("photoWrapper");

const removeBgBtn =
    document.getElementById("removeBgBtn");

const whiteBgBtn =
    document.getElementById("whiteBgBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const uploadPortalBtn =
    document.getElementById("uploadPortalBtn");

const retakeBtn =
    document.getElementById("retakeBtn");

const backgroundOptions =
    document.getElementById("backgroundOptions");

const transparentBtn =
    document.getElementById("transparentBtn");

const whiteOptionBtn =
    document.getElementById("whiteOptionBtn");

const processing =
    document.getElementById("processing");

const processingTitle =
    document.getElementById("processingTitle");

const processingText =
    document.getElementById("processingText");

const cameraStudent =
    document.getElementById("cameraStudent");

const previewStudent =
    document.getElementById("previewStudent");

const previewStatus =
    document.getElementById("previewStatus");


/* =========================================================
   CAMERA VARIABLES
   ========================================================= */

let stream = null;
let cameras = [];
let currentCameraIndex = 0;
let currentFacing = "user";

let studentIDValue = "";

let capturedBlob = null;
let capturedURL = null;

let originalBlob = null;
let fullResolutionBlob = null;
let transparentBlob = null;
let whiteBlob = null;


/* =========================================================
   CLOUD AI BACKGROUND REMOVAL — BRIA RMBG 2.0
   ========================================================= */

/*
 * Bria provides a cloud RMBG 2.0 endpoint. This removes the large local
 * ONNX/WASM model from the browser, so Android phones do not spend minutes
 * downloading/loading a segmentation model.
 *
 * IMPORTANT:
 * A token entered in a static GitHub Pages site is visible to the browser.
 * For a public production kiosk, use REMOVE_BG_PROXY_URL instead and keep
 * the Bria token on your server/Cloudflare Worker.
 */
const BRIA_REMOVE_BG_URL =
    "https://engine.prod.bria-api.com/v2/image/edit/remove_background";

const REMOVE_BG_PROXY_URL = "";
const BRIA_TOKEN_STORAGE_KEY = "djis_bria_api_token_v1";

let briaToken = "";

function getStoredBriaToken(){
    try{
        return (localStorage.getItem(BRIA_TOKEN_STORAGE_KEY) || "").trim();
    }catch(error){
        console.warn("Unable to read saved Bria API token:", error);
        return "";
    }
}

function saveBriaToken(token){
    try{
        localStorage.setItem(BRIA_TOKEN_STORAGE_KEY, token.trim());
    }catch(error){
        console.warn("Unable to save Bria API token:", error);
    }
}

function clearSavedBriaToken(){
    try{
        localStorage.removeItem(BRIA_TOKEN_STORAGE_KEY);
    }catch(error){
        console.warn(error);
    }
    briaToken = "";
}

function ensureAITokenModal(){
    if(document.getElementById("aiTokenModal")) return;

    const modal = document.createElement("div");
    modal.id = "aiTokenModal";
    modal.className = "ai-token-modal";
    modal.innerHTML = `
        <div class="ai-token-box" role="dialog" aria-modal="true" aria-labelledby="aiTokenTitle">
            <div id="aiTokenTitle" class="ai-token-title">Cloud AI Background Removal</div>
            <div class="ai-token-text">
                Enter your Bria API token. Your photo is processed in the cloud,
                so Android does not need to load a large AI model locally.
                The token is stored only in this browser.
            </div>
            <input id="aiTokenInput" class="ai-token-input" type="password"
                   autocomplete="off" spellcheck="false" placeholder="Enter Bria API token">
            <div class="ai-token-actions">
                <button id="aiTokenCancel" type="button">CANCEL</button>
                <button id="aiTokenSave" class="ai-token-save" type="button">SAVE TOKEN</button>
            </div>
            <a class="ai-token-link" href="https://platform.bria.ai/" target="_blank" rel="noopener">
                CREATE / MANAGE BRIA API TOKEN
            </a>
        </div>`;
    document.body.appendChild(modal);
}

function openAITokenModal(){
    ensureAITokenModal();
    const modal = document.getElementById("aiTokenModal");
    const input = document.getElementById("aiTokenInput");
    if(!modal || !input) return;

    input.value = getStoredBriaToken();
    modal.classList.add("show");

    setTimeout(function(){
        input.focus();
        input.select();
    },50);
}

function closeAITokenModal(){
    const modal = document.getElementById("aiTokenModal");
    if(modal) modal.classList.remove("show");
}

function requestAIToken(){
    return new Promise(function(resolve,reject){
        ensureAITokenModal();

        const modal = document.getElementById("aiTokenModal");
        const input = document.getElementById("aiTokenInput");
        const saveBtn = document.getElementById("aiTokenSave");
        const cancelBtn = document.getElementById("aiTokenCancel");

        if(!modal || !input || !saveBtn || !cancelBtn){
            reject(new Error("AI token settings are unavailable."));
            return;
        }

        const finish = function(token,error){
            saveBtn.removeEventListener("click",onSave);
            cancelBtn.removeEventListener("click",onCancel);
            input.removeEventListener("keydown",onKey);
            closeAITokenModal();
            if(error) reject(error);
            else resolve(token);
        };

        const onSave = function(){
            const token = input.value.trim();
            if(!token){
                alert("Please enter your Bria API token.");
                input.focus();
                return;
            }
            saveBriaToken(token);
            finish(token,null);
        };

        const onCancel = function(){
            finish(null,new Error("No Bria API token was provided."));
        };

        const onKey = function(event){
            if(event.key === "Enter") onSave();
            if(event.key === "Escape") onCancel();
        };

        saveBtn.addEventListener("click",onSave);
        cancelBtn.addEventListener("click",onCancel);
        input.addEventListener("keydown",onKey);

        openAITokenModal();
    });
}

async function getBriaToken(){
    let token = briaToken || getStoredBriaToken();

    if(!token){
        token = await requestAIToken();
    }

    briaToken = token;
    return token;
}

async function prepareCloudAIInput(blob){
    const image = await loadImageFromBlob(blob);

    /* Keep enough resolution for hair/ears while avoiding huge uploads. */
    const maxDimension = 2048;
    const iw = image.naturalWidth || image.width;
    const ih = image.naturalHeight || image.height;
    const scale = Math.min(1, maxDimension / Math.max(iw,ih));

    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1,Math.round(iw * scale));
    canvas.height = Math.max(1,Math.round(ih * scale));

    const ctx = canvas.getContext("2d",{alpha:false});
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(image,0,0,canvas.width,canvas.height);

    return await canvasToDataURL(canvas,"image/jpeg",0.94);
}

function canvasToDataURL(canvas,type,quality){
    return canvas.toDataURL(type,quality);
}

function loadImageFromBlob(blob){
    return new Promise(function(resolve,reject){
        const image = new Image();
        const url = URL.createObjectURL(blob);

        image.onload = function(){
            URL.revokeObjectURL(url);
            resolve(image);
        };

        image.onerror = function(){
            URL.revokeObjectURL(url);
            reject(new Error("Could not load the captured photo."));
        };

        image.src = url;
    });
}

function canvasToBlob(canvas,type,quality){
    return new Promise(function(resolve,reject){
        canvas.toBlob(function(blob){
            if(blob) resolve(blob);
            else reject(new Error("Could not create the AI input image."));
        },type,quality);
    });
}

async function fetchBlobFromURL(url){
    const response = await fetch(url,{mode:"cors",cache:"no-store"});
    if(!response.ok){
        throw new Error("The AI result image could not be downloaded (HTTP " + response.status + ").");
    }
    return await response.blob();
}

async function runBriaBackgroundRemoval(blob){
    const aiInput = await prepareCloudAIInput(blob);

    showProcessing(
        "AI Background Removal",
        "Sending photo to secure cloud AI..."
    );

    let response;

    if(REMOVE_BG_PROXY_URL.trim()){
        response = await fetch(REMOVE_BG_PROXY_URL.trim(),{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                image:aiInput,
                preserve_alpha:true,
                sync:true
            })
        });
    }else{
        const token = await getBriaToken();

        response = await fetch(BRIA_REMOVE_BG_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "api_token":token
            },
            body:JSON.stringify({
                image:aiInput,
                preserve_alpha:true,
                sync:true
            })
        });
    }

    const responseText = await response.text();
    let data = null;

    try{
        data = responseText ? JSON.parse(responseText) : null;
    }catch(error){
        data = null;
    }

    if(!response.ok){
        console.error("Bria background removal response:",response.status,responseText);

        if(response.status === 401 || response.status === 403){
            clearSavedBriaToken();
            throw new Error("The Bria API token was rejected. Open AI TOKEN SETTINGS and enter a valid token.");
        }

        if(response.status === 429){
            throw new Error("The Bria service is busy or the request limit was reached. Please try again in a moment.");
        }

        if(response.status === 415){
            throw new Error("The photo format is not supported by the Bria background-removal service.");
        }

        const detail =
            (data && (data.message || data.error || data.detail)) ||
            responseText.slice(0,240);

        throw new Error("Cloud AI request failed (HTTP " + response.status + "): " + detail);
    }

    /* Bria v2 synchronous requests return result.image_url. */
    const imageURL = data && data.result && data.result.image_url;

    if(!imageURL){
        throw new Error("Cloud AI completed but did not return an output image.");
    }

    showProcessing(
        "Downloading Cutout",
        "Refining the AI result for the ID photo..."
    );

    return await fetchBlobFromURL(imageURL);
}

async function initializeBackgroundRemoval(){
    /* No local model is downloaded. The actual request starts on demand. */
    return true;
}

async function runBackgroundRemoval(blob){
    return await runBriaBackgroundRemoval(blob);
}

/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera(deviceId=null){

    try{

        stopCamera();

        const constraints = {

            audio:false,

            video:deviceId
                ? {

                    deviceId:{
                        exact:deviceId
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    }

                }
                : {

                    facingMode:{
                        ideal:currentFacing
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    }

                }

        };

        stream =
            await navigator.mediaDevices
                .getUserMedia(constraints);

        video.srcObject =
            stream;

        await video.play();

        await updateCameraList();

    }catch(error){

        console.error(error);

        let message =
            "Unable to access the camera.";

        if(error.name === "NotAllowedError"){

            message =
                "Camera permission was denied. " +
                "Please allow camera access.";

        }else if(error.name === "NotFoundError"){

            message =
                "No camera was found on this device.";

        }else if(error.name === "NotReadableError"){

            message =
                "The camera is already being used " +
                "by another application.";

        }else if(error.name === "SecurityError"){

            message =
                "Camera access is blocked by browser security. " +
                "Please open this website using HTTPS.";

        }

        alert(message);

    }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera(){

    if(stream){

        stream.getTracks().forEach(
            function(track){

                track.stop();

            }
        );

        stream = null;

    }

    video.srcObject = null;

}


/* =========================================================
   UPDATE CAMERA LIST
   ========================================================= */

async function updateCameraList(){

    try{

        const devices =
            await navigator.mediaDevices
                .enumerateDevices();

        cameras =
            devices.filter(
                function(device){

                    return (
                        device.kind ===
                        "videoinput"
                    );

                }
            );

        if(cameras.length > 1){

            cameraSelect.style.display =
                "block";

            cameraSelect.innerHTML = "";

            cameras.forEach(
                function(camera,index){

                    const option =
                        document.createElement("option");

                    option.value =
                        camera.deviceId;

                    option.textContent =
                        camera.label ||
                        "Camera " + (index + 1);

                    cameraSelect.appendChild(option);

                }
            );

        }else{

            cameraSelect.style.display =
                "none";

        }

    }catch(error){

        console.warn(
            "Unable to enumerate cameras:",
            error
        );

    }

}


/* =========================================================
   SWITCH CAMERA
   ========================================================= */

async function switchCamera(){

    if(cameras.length > 1){

        currentCameraIndex++;

        if(
            currentCameraIndex >=
            cameras.length
        ){

            currentCameraIndex = 0;

        }

        await startCamera(
            cameras[
                currentCameraIndex
            ].deviceId
        );

    }else{

        currentFacing =
            currentFacing === "user"
                ? "environment"
                : "user";

        await startCamera();

    }

}


/* =========================================================
   CAMERA SELECT
   ========================================================= */

cameraSelect.addEventListener(
    "change",
    async function(){

        const deviceId =
            this.value;

        await startCamera(deviceId);

    }
);


/* =========================================================
   CREATE FULL CAMERA CANVAS
   ========================================================= */

function createFullVideoCanvas(){

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;

    if(!width || !height){

        throw new Error(
            "Camera image is not ready."
        );

    }

    const canvas =
        document.createElement("canvas");

    canvas.width =
        width;

    canvas.height =
        height;

    const ctx =
        canvas.getContext("2d");

    if(currentFacing === "user"){

        ctx.translate(width,0);
        ctx.scale(-1,1);

    }

    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    return canvas;

}


/* =========================================================
   CROP TO 350 × 450
   ========================================================= */

function cropToIDPhoto(sourceCanvas){

    const sourceWidth =
        sourceCanvas.width;

    const sourceHeight =
        sourceCanvas.height;

    const targetRatio =
        OUTPUT_WIDTH /
        OUTPUT_HEIGHT;

    const sourceRatio =
        sourceWidth /
        sourceHeight;

    let cropWidth;
    let cropHeight;
    let cropX;
    let cropY;

    if(sourceRatio > targetRatio){

        cropHeight =
            sourceHeight;

        cropWidth =
            sourceHeight *
            targetRatio;

        cropX =
            (sourceWidth - cropWidth) / 2;

        cropY = 0;

    }else{

        cropWidth =
            sourceWidth;

        cropHeight =
            sourceWidth /
            targetRatio;

        cropX = 0;

        cropY =
            (sourceHeight - cropHeight) / 2;

    }

    const canvas =
        document.createElement("canvas");

    canvas.width =
        OUTPUT_WIDTH;

    canvas.height =
        OUTPUT_HEIGHT;

    const ctx =
        canvas.getContext("2d");

    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";

    ctx.drawImage(
        sourceCanvas,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        OUTPUT_WIDTH,
        OUTPUT_HEIGHT
    );

    return canvas;

}


/* =========================================================
   CAPTURE PHOTO
   ========================================================= */

async function capturePhoto(){

    try{

        if(
            !video.videoWidth ||
            !video.videoHeight
        ){

            alert(
                "Camera is not ready yet."
            );

            return;

        }

        captureBtn.disabled = true;

        const originalButtonHTML =
            captureBtn.innerHTML;

        captureBtn.innerHTML =
            '<span style="font-size:20px;">⏳</span>';

        showProcessing(
            "Capturing Photo",
            "Preparing the high-resolution image..."
        );

        /*
         * IMPORTANT:
         * Keep the camera's full resolution for AI background removal.
         * The previous version first reduced the image to 350×450,
         * which made the AI edge mask visibly pixelated.
         */
        const fullCanvas =
            createFullVideoCanvas();

        fullResolutionBlob =
            await canvasToBlob(
                fullCanvas,
                "image/png"
            );

        /*
         * Create the normal 350×450 ID-photo preview.
         * This is only the display/export size; AI uses fullResolutionBlob.
         */
        const finalCanvas =
            cropToIDPhoto(fullCanvas);

        const previewBlob =
            await canvasToBlob(
                finalCanvas,
                "image/png"
            );

        if(!previewBlob){
            throw new Error(
                "Unable to create photo."
            );
        }

        originalBlob =
            previewBlob;

        capturedBlob =
            previewBlob;

        if(capturedURL){
            URL.revokeObjectURL(
                capturedURL
            );
        }

        capturedURL =
            URL.createObjectURL(
                previewBlob
            );

        previewImage.src =
            capturedURL;

        transparentBlob =
            null;

        whiteBlob =
            null;

        photoWrapper.classList.remove(
            "transparent"
        );

        previewStatus.textContent =
            "ORIGINAL PHOTO";

        removeBgBtn.style.display =
            "block";

        removeBgBtn.disabled =
            false;

        removeBgBtn.textContent =
            "✨ REMOVE BACKGROUND";

        whiteBgBtn.style.display =
            "none";

        backgroundOptions.style.display =
            "none";

        uploadPortalBtn.style.display =
            "block";

        cameraScreen.classList.add(
            "hidden"
        );

        previewScreen.classList.remove(
            "hidden"
        );

        stopCamera();

        captureBtn.disabled =
            false;

        captureBtn.innerHTML =
            originalButtonHTML;

        hideProcessing();

    }catch(error){

        console.error(
            "Capture error:",
            error
        );

        hideProcessing();

        alert(
            "Unable to capture photo."
        );

        captureBtn.disabled =
            false;

        captureBtn.innerHTML =
            '<span style="font-size:16px;">📸</span>';

    }

}

/* =========================================================
   REMOVE BACKGROUND - HIGH QUALITY AI
   ========================================================= */

async function removeBackground(){

    if(!originalBlob){
        alert(
            "Please capture a photo first."
        );
        return;
    }

    try{

        removeBgBtn.disabled =
            true;

        removeBgBtn.textContent =
            "⏳ PROCESSING...";

        showProcessing(
            "Removing Background",
            "Cloud AI is preparing your photo..."
        );

        await initializeBackgroundRemoval();

        /*
         * Use the ORIGINAL FULL-RESOLUTION camera frame for AI.
         * This is the key quality improvement.
         */
        const aiInput =
            fullResolutionBlob ||
            originalBlob;

        showProcessing(
            "Removing Background",
            "AI is separating the person from the background..."
        );

        const aiBlob =
            await runBackgroundRemoval(
                aiInput
            );

        if(!aiBlob){
            throw new Error(
                "AI did not return an image."
            );
        }

        showProcessing(
            "Softening Edges",
            "Refining hair, ears and shoulder edges..."
        );

        /*
         * Crop the AI result AFTER segmentation.
         * The alpha edge is therefore downsampled from the
         * high-resolution mask into the final 350×450 image.
         */
        transparentBlob =
            await cropAndSoftenTransparentPNG(
                aiBlob
            );

        if(!transparentBlob){
            throw new Error(
                "Unable to create transparent PNG."
            );
        }

        capturedBlob =
            transparentBlob;

        if(capturedURL){
            URL.revokeObjectURL(
                capturedURL
            );
        }

        capturedURL =
            URL.createObjectURL(
                transparentBlob
            );

        previewImage.src =
            capturedURL;

        photoWrapper.classList.add(
            "transparent"
        );

        previewStatus.textContent =
            "BACKGROUND REMOVED • BRIA CLOUD AI";

        backgroundOptions.style.display =
            "grid";

        whiteBgBtn.style.display =
            "block";

        transparentBtn.classList.add(
            "active"
        );

        whiteOptionBtn.classList.remove(
            "active"
        );

        removeBgBtn.textContent =
            "✓ BACKGROUND REMOVED";

        removeBgBtn.disabled =
            true;

        hideProcessing();

    }catch(error){

        console.error(
            "AI background removal error:",
            error
        );

        hideProcessing();

        let message =
            "Unable to remove the background.\n\n" +
            (error && error.message ? error.message : "The cloud AI service could not process the photo.") +
            "\n\nOpen AI TOKEN SETTINGS to update the Bria token if necessary.";

        /* Keep the normal message clean, but expose a short diagnostic in
           the console so the exact failure can be identified if needed. */
        if(error && error.message){
            console.error("BACKGROUND REMOVAL DIAGNOSTIC:", error.message);
        }

        if(
            error &&
            error.message
        ){
            console.warn(
                error.message
            );
        }

        alert(message);

        removeBgBtn.disabled =
            false;

        removeBgBtn.textContent =
            "✨ REMOVE BACKGROUND";

    }

}

/* =========================================================
   NORMALIZE AI PNG
   ========================================================= */

async function cropAndSoftenTransparentPNG(blob){

    const image =
        new Image();

    const url =
        URL.createObjectURL(blob);

    try{

        await new Promise(
            function(resolve,reject){

                image.onload =
                    resolve;

                image.onerror =
                    reject;

                image.src =
                    url;

            }
        );

        /*
         * First resize the AI result from its native/full resolution
         * into the exact 7:9 ID-photo crop. High-quality canvas
         * resampling creates a much smoother alpha edge than processing
         * an already-small 350×450 image.
         */
        const sourceWidth =
            image.naturalWidth ||
            image.width;

        const sourceHeight =
            image.naturalHeight ||
            image.height;

        const targetRatio =
            OUTPUT_WIDTH /
            OUTPUT_HEIGHT;

        const sourceRatio =
            sourceWidth /
            sourceHeight;

        let cropWidth;
        let cropHeight;
        let cropX;
        let cropY;

        if(sourceRatio > targetRatio){

            cropHeight =
                sourceHeight;

            cropWidth =
                sourceHeight *
                targetRatio;

            cropX =
                (sourceWidth - cropWidth) / 2;

            cropY = 0;

        }else{

            cropWidth =
                sourceWidth;

            cropHeight =
                sourceWidth /
                targetRatio;

            cropX = 0;

            cropY =
                (sourceHeight - cropHeight) / 2;

        }

        const canvas =
            document.createElement("canvas");

        canvas.width =
            OUTPUT_WIDTH;

        canvas.height =
            OUTPUT_HEIGHT;

        const ctx =
            canvas.getContext(
                "2d",
                {
                    alpha:true,
                    willReadFrequently:true
                }
            );

        ctx.clearRect(
            0,
            0,
            OUTPUT_WIDTH,
            OUTPUT_HEIGHT
        );

        ctx.imageSmoothingEnabled =
            true;

        ctx.imageSmoothingQuality =
            "high";

        ctx.drawImage(
            image,
            cropX,
            cropY,
            cropWidth,
            cropHeight,
            0,
            0,
            OUTPUT_WIDTH,
            OUTPUT_HEIGHT
        );

        /*
         * Small edge refinement:
         * - remove extremely faint ghost pixels
         * - lightly smooth only pixels around the alpha transition
         * - keep solid subject pixels untouched
         *
         * This avoids the hard stair-step edge visible in the
         * previous result without making the person look blurry.
         */
        softenAlphaEdges(ctx);

        return await canvasToBlob(
            canvas,
            "image/png"
        );

    }finally{

        URL.revokeObjectURL(
            url
        );

    }

}


/* =========================================================
   SOFT ALPHA EDGE REFINEMENT
   ========================================================= */

function softenAlphaEdges(ctx){

    const imageData =
        ctx.getImageData(
            0,
            0,
            OUTPUT_WIDTH,
            OUTPUT_HEIGHT
        );

    const pixels =
        imageData.data;

    const width =
        OUTPUT_WIDTH;

    const height =
        OUTPUT_HEIGHT;

    /*
     * Remove very low-alpha residue first.
     * These pixels are usually background-colored ghosting.
     */
    for(
        let i = 3;
        i < pixels.length;
        i += 4
    ){

        if(pixels[i] < 10){
            pixels[i] = 0;
        }

    }

    /*
     * 3×3 Gaussian-like alpha smoothing.
     * RGB is NOT blurred, only the transparency edge.
     */
    const sourceAlpha =
        new Uint8ClampedArray(
            width * height
        );

    for(
        let y = 0;
        y < height;
        y++
    ){

        for(
            let x = 0;
            x < width;
            x++
        ){

            sourceAlpha[
                y * width + x
            ] =
                pixels[
                    (y * width + x) * 4 + 3
                ];

        }

    }

    const weights = [
        1,2,1,
        2,4,2,
        1,2,1
    ];

    for(
        let y = 1;
        y < height - 1;
        y++
    ){

        for(
            let x = 1;
        x < width - 1;
        x++
        ){

            const index =
                y * width + x;

            const a =
                sourceAlpha[index];

            /*
             * Only refine transition pixels.
             * Fully opaque and fully transparent areas remain exact.
             */
            if(
                a <= 12 ||
                a >= 243
            ){
                continue;
            }

            let sum = 0;
            let weightSum = 0;
            let hasTransparentNeighbor = false;
            let hasOpaqueNeighbor = false;

            let wi = 0;

            for(
                let dy = -1;
                dy <= 1;
                dy++
            ){

                for(
                    let dx = -1;
                    dx <= 1;
                    dx++
                ){

                    const neighbor =
                        sourceAlpha[
                            (y + dy) * width +
                            (x + dx)
                        ];

                    const weight =
                        weights[wi++];

                    sum +=
                        neighbor *
                        weight;

                    weightSum +=
                        weight;

                    if(neighbor < 30){
                        hasTransparentNeighbor = true;
                    }

                    if(neighbor > 225){
                        hasOpaqueNeighbor = true;
                    }

                }

            }

            /*
             * Only soften an actual boundary.
             */
            if(
                hasTransparentNeighbor &&
                hasOpaqueNeighbor
            ){

                pixels[
                    index * 4 + 3
                ] =
                    Math.round(
                        sum /
                        weightSum
                    );

            }

        }

    }

    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* =========================================================
   LEGACY NORMALIZE WRAPPER
   ========================================================= */

async function normalizeTransparentPNG(blob){
    return await cropAndSoftenTransparentPNG(blob);
}

/* =========================================================
   CANVAS → BLOB
   ========================================================= */

function canvasToBlob(canvas,type){

    return new Promise(
        function(resolve,reject){

            canvas.toBlob(
                function(blob){

                    if(blob){

                        resolve(blob);

                    }else{

                        reject(
                            new Error(
                                "PNG creation failed."
                            )
                        );

                    }

                },
                type
            );

        }
    );

}


/* =========================================================
   APPLY WHITE BACKGROUND
   ========================================================= */

async function applyWhiteBackground(){

    if(!transparentBlob){

        return;

    }

    try{

        showProcessing(
            "Creating White Background",
            "Preparing your ID photo..."
        );

        const image =
            new Image();

        const url =
            URL.createObjectURL(
                transparentBlob
            );

        await new Promise(
            function(resolve,reject){

                image.onload =
                    resolve;

                image.onerror =
                    reject;

                image.src =
                    url;

            }
        );

        URL.revokeObjectURL(url);

        const canvas =
            document.createElement("canvas");

        canvas.width =
            OUTPUT_WIDTH;

        canvas.height =
            OUTPUT_HEIGHT;

        const ctx =
            canvas.getContext("2d");

        ctx.fillStyle =
            "#FFFFFF";

        ctx.fillRect(
            0,
            0,
            OUTPUT_WIDTH,
            OUTPUT_HEIGHT
        );

        ctx.drawImage(
            image,
            0,
            0,
            OUTPUT_WIDTH,
            OUTPUT_HEIGHT
        );

        whiteBlob =
            await canvasToBlob(
                canvas,
                "image/png"
            );

        capturedBlob =
            whiteBlob;

        if(capturedURL){

            URL.revokeObjectURL(
                capturedURL
            );

        }

        capturedURL =
            URL.createObjectURL(
                whiteBlob
            );

        previewImage.src =
            capturedURL;

        photoWrapper.classList.remove(
            "transparent"
        );

        previewStatus.textContent =
            "WHITE BACKGROUND";

        transparentBtn.classList.remove(
            "active"
        );

        whiteOptionBtn.classList.add(
            "active"
        );

        hideProcessing();

    }catch(error){

        console.error(error);

        hideProcessing();

        alert(
            "Unable to create white background."
        );

    }

}


/* =========================================================
   RETURN TO TRANSPARENT
   ========================================================= */

function showTransparent(){

    if(!transparentBlob){

        return;

    }

    capturedBlob =
        transparentBlob;

    if(capturedURL){

        URL.revokeObjectURL(
            capturedURL
        );

    }

    capturedURL =
        URL.createObjectURL(
            transparentBlob
        );

    previewImage.src =
        capturedURL;

    photoWrapper.classList.add(
        "transparent"
    );

    previewStatus.textContent =
        "BACKGROUND REMOVED";

    transparentBtn.classList.add(
        "active"
    );

    whiteOptionBtn.classList.remove(
        "active"
    );

}


/* =========================================================
   BUILD DJIS PORTAL URL
   ========================================================= */

function getDJISPortalURL(){

    const cleanStudentID =
        studentIDValue
            .trim();

    if(!cleanStudentID){

        return null;

    }

    return (
        PORTAL_BASE_URL +
        "?std=" +
        encodeURIComponent(
            cleanStudentID
        ) +
        "&sy=" +
        encodeURIComponent(
            SCHOOL_YEAR
        )
    );

}


/* =========================================================
   DOWNLOAD PHOTO
   ========================================================= */

function downloadPhoto(){

    if(!capturedBlob){

        alert(
            "Please capture a photo first."
        );

        return;

    }

    const cleanStudentID =
        studentIDValue
            .trim();

    if(!cleanStudentID){

        alert(
            "Student ID is missing."
        );

        return;

    }


    /* =====================================================
       BUILD FILENAME
       ===================================================== */

    const safeID =
        cleanStudentID
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );

    const filename =
        (safeID || "student_photo") +
        ".png";


    /* =====================================================
       BUILD PORTAL URL
       ===================================================== */

    const portalURL =
        getDJISPortalURL();


    /* =====================================================
       OPEN PORTAL FIRST
       
       Opening it directly from the user's click
       helps avoid popup-blocker problems.
       ===================================================== */

    let portalWindow = null;

    if(portalURL){

        portalWindow =
            window.open(
                portalURL,
                "_blank"
            );

    }


    /* =====================================================
       DOWNLOAD PHOTO
       ===================================================== */

    const url =
        URL.createObjectURL(
            capturedBlob
        );

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        filename;

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(url);

        },
        1500
    );


    /* =====================================================
       PORTAL RESULT
       ===================================================== */

    if(!portalWindow){

        alert(
            "Photo downloaded as:\n\n" +
            filename +
            "\n\n" +
            "The DJIS Portal could not be opened " +
            "because the browser blocked the popup.\n\n" +
            "Please allow pop-ups for this website."
        );

        return;

    }


    /* =====================================================
       TRY TO FOCUS PORTAL
       ===================================================== */

    try{

        portalWindow.focus();

    }catch(error){

        console.warn(
            "Unable to focus portal:",
            error
        );

    }

}


/* =========================================================
   MANUAL OPEN DJIS PORTAL
   ========================================================= */

function openDJISPortal(){

    if(!studentIDValue){

        alert(
            "Student ID is missing.\n\n" +
            "Please start again and enter the Student ID."
        );

        return;

    }

    const cleanStudentID =
        studentIDValue
            .trim();

    if(!cleanStudentID){

        alert(
            "Invalid Student ID."
        );

        return;

    }

    const portalURL =
        getDJISPortalURL();

    const confirmed =
        confirm(
            "OPEN DJIS PORTAL\n\n" +
            "Student ID: " +
            cleanStudentID +
            "\n" +
            "School Year: " +
            SCHOOL_YEAR +
            "\n\n" +
            "The portal will open for this student.\n\n" +
            "Continue?"
        );

    if(!confirmed){

        return;

    }

    const portalWindow =
        window.open(
            portalURL,
            "_blank"
        );

    if(!portalWindow){

        alert(
            "The portal could not be opened.\n\n" +
            "Please allow pop-ups for this website."
        );

        return;

    }

    try{

        portalWindow.focus();

    }catch(error){

        console.warn(
            "Unable to focus portal window:",
            error
        );

    }

}


/* =========================================================
   RETAKE
   ========================================================= */

async function retakePhoto(){

    if(capturedURL){

        URL.revokeObjectURL(
            capturedURL
        );

        capturedURL = null;

    }

    capturedBlob = null;
    originalBlob = null;
    fullResolutionBlob = null;
    transparentBlob = null;
    whiteBlob = null;

    previewImage.removeAttribute(
        "src"
    );

    photoWrapper.classList.remove(
        "transparent"
    );

    previewStatus.textContent =
        "ORIGINAL PHOTO";

    removeBgBtn.style.display =
        "none";

    whiteBgBtn.style.display =
        "none";

    backgroundOptions.style.display =
        "none";

    previewScreen.classList.add(
        "hidden"
    );

    cameraScreen.classList.remove(
        "hidden"
    );

    await startCamera();

}
